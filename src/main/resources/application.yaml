spring:
  application:
    name: ifs25040-p5-pbo2026-springboot-cashflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pbo2026_cashflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
server:
  port: ${APP_PORT:8080}
vaadin:
  launch-browser: false
app:
  upload-dir: ${UPLOAD_DIR:uploads}
